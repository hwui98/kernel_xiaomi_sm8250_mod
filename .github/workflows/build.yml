name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Build Command (example: bash build.sh umi 或 bash build.sh umi ksu)'
        required: true
        default: 'bash build.sh umi'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev libelf-dev python3 python3-pip

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton-clang

      - name: Build Kernel
        run: |
          export TOOLCHAIN_PATH="$GITHUB_WORKSPACE/proton-clang/bin"
          export PATH="$TOOLCHAIN_PATH:$PATH"
          ${{ github.event.inputs.command }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Outputs
          path: ./*.zip
