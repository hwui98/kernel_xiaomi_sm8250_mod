name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04   # 使用较旧的系统，避免 glibc 冲突
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libncurses5-dev libelf-dev python3 python3-pip

      - name: Clone Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang proton-clang

      - name: Build Kernel
        run: |
          export TOOLCHAIN_PATH="$GITHUB_WORKSPACE/proton-clang/bin"
          export PATH="$TOOLCHAIN_PATH:$PATH"
          bash build.sh umi${{ github.event.inputs.ksu == 'true' && ' ksu' || '' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Outputs
          path: ./*.zip
